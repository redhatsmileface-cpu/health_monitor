name: Website Health Check

on:
  schedule:
    # This runs every 6 hours. Format is: min hour day month weekday
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to run it manually from the UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Monitoring Script
      run: python monitor.py

    - name: Commit and Push Log
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add uptime_log.txt
        git commit -m "Update uptime log [skip ci]" || echo "No changes to commit"
        git push